# `cargo audit` (see .github/workflows/audit.yml). Every ignore names why,
# and what would let it go.
[advisories]
ignore = [
  # libsqlite3-sys 0.38 bundles SQLite before 3.54, which can return
  # uninitialised page-cache memory when it opens a database beside a `-wal`
  # file of a different page size. Only reachable by somebody who can write
  # files into the vault's own directory, who could already do far worse.
  # Held by matrix-sdk-sqlite 0.19, which requires rusqlite ^0.40.2, and one
  # build may link only one SQLite. Goes when matrix-sdk moves to rusqlite
  # 0.41 (libsqlite3-sys 0.39).
  "RUSTSEC-2026-0459",
]
