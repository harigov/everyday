# Build the desktop app for Linux, macOS and Windows, and optionally attach
# the bundles to a GitHub Release.
#
# Cost: this repository is public, and every runner used below is a *standard*
# GitHub-hosted runner (ubuntu-22.04, macos-latest, windows-latest). Standard
# runners, and the artifact/log storage they produce, are free and unmetered
# on public repositories. The things that do cost money are larger runners
# (the `-4-core`/`-xlarge`/`-large` labels, and anything under an org's runner
# groups) and self-hosted minutes -- none of which appear here. Keep it that
# way: if you ever change a `runs-on:`, check the label against
# https://docs.github.com/actions/reference/runners/github-hosted-runners
# first, because larger runners are billed even on public repositories.

name: Release

# Manual only, on purpose. There is no `push`, `pull_request`, `schedule` or
# `release` trigger, so nothing here can start a build on its own -- a run
# only happens when a human clicks "Run workflow" (or calls the API).
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        type: choice
        default: all
        options:
          - all
          - linux
          - macos
          - windows
      release:
        description: "What to do with the bundles"
        type: choice
        default: none
        options:
          - none      # build only; download them from the run's artifacts
          - draft     # create a draft Release you publish by hand
          - publish   # create a published Release
      tag:
        description: "Release tag (default: v<version> from tauri.conf.json)"
        type: string
        default: ""

# The default token is read-only; only the release job widens it.
permissions:
  contents: read

# One release run at a time per ref. Not cancel-in-progress: interrupting a
# run halfway through uploading assets is worse than waiting for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves the version and turns the `platforms` choice into a build matrix,
  # so the three build jobs stay one definition rather than three copies.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: plan
        # Workflow inputs reach the script through the environment, never
        # through `${{ }}` interpolation -- interpolation would splice the
        # caller's text into the shell source itself.
        env:
          PLATFORMS: ${{ inputs.platforms }}
          RELEASE: ${{ inputs.release }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          version=$(node -p "require('./crates/jatayu-app/tauri.conf.json').version")
          tag=${TAG_INPUT:-v$version}

          # Echoed to the log, not just the summary: the API does not record
          # what a workflow_dispatch was called with, so without this the only
          # evidence of the requested inputs is whichever jobs happen to run.
          echo "requested: platforms=$PLATFORMS release=$RELEASE tag=${TAG_INPUT:-<default>}"

          # The tag ends up as a git ref and a CLI argument. Refuse anything
          # that is not plainly a tag rather than finding out later.
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/+-]*$'; then
            echo "::error::refusing tag '$tag': expected letters, digits and . _ / + -" >&2
            exit 1
          fi

          # macOS builds one universal binary rather than two per-arch ones:
          # the runner is arm64 and Rust cross-compiles the x86_64 half for
          # free, which is cheaper than a second job and gives users one DMG.
          linux='{"name":"linux","os":"ubuntu-22.04","bundles":"deb,rpm,appimage","rust_target":"","bundle_dir":"target/dist/bundle"}'
          macos='{"name":"macos","os":"macos-latest","bundles":"dmg","rust_target":"universal-apple-darwin","bundle_dir":"target/universal-apple-darwin/dist/bundle"}'
          windows='{"name":"windows","os":"windows-latest","bundles":"msi,nsis","rust_target":"","bundle_dir":"target/dist/bundle"}'

          case "$PLATFORMS" in
            all)     include="[$linux,$macos,$windows]" ;;
            linux)   include="[$linux]" ;;
            macos)   include="[$macos]" ;;
            windows) include="[$windows]" ;;
            *) echo "::error::unknown platforms input '$PLATFORMS'" >&2; exit 1 ;;
          esac

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "matrix={\"include\":$include}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "Building **$PLATFORMS** for $version (tag \`$tag\`)"
            echo "release=\`$RELEASE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    # A cold Tauri release build is 15-25 minutes, but this workspace bundles
    # SQLite from C source and the `dist` profile uses LTO with
    # codegen-units=1, which roughly doubles that on a 4-core runner. 90
    # minutes is generous enough not to trip on a slow runner and short enough
    # that a hung build stops rather than sitting at GitHub's 6-hour ceiling.
    timeout-minutes: 90
    strategy:
      # One platform failing should not throw away the two that worked.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        # Git Bash on the Windows runner, so the steps below are one dialect.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          # universal-apple-darwin is not a rustup target; it is the two real
          # Apple targets that `tauri build` then lipos together.
          if [ "$RUST_TARGET" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          elif [ -n "$RUST_TARGET" ]; then
            rustup target add "$RUST_TARGET"
          fi
          rustc --version

      # Only the downloaded crate sources are cached, not `target/`. A release
      # artifact should come out of a clean compile; caching the registry
      # saves the slow part (fetching ~400 crates) without that risk.
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Same set as scripts/setup-linux.sh, plus the three tools linuxdeploy
      # shells out to when it assembles the AppImage -- less the Vulkan
      # headers and `glslc`, which Ubuntu 22.04 does not package; the step
      # after this fetches them. `libvulkan1` is the loader the app links,
      # which linuxdeploy has to find to bundle the AppImage. libpipewire/libspa are
      # for `capture.rs`'s loopback track, built with the `pipewire` cpal
      # feature on this target only; libclang is for `bindgen`, which
      # `libspa-sys`/`pipewire-sys` run at build time against those headers --
      # see check.yml's identical step for why it is asked for by name rather
      # than assumed present.
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libspa-0.2-dev \
            libclang-dev \
            libvulkan1 \
            build-essential curl wget file patchelf desktop-file-utils

      # llama.cpp's Vulkan backend (see crates/jatayu-service/Cargo.toml)
      # needs the Vulkan headers, SPIRV-Headers and `glslc` to build. LunarG's
      # SDK carries all three, checked against a pinned SHA-256.
      - name: Fetch and check the Vulkan SDK
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          sdk=$(scripts/vulkan-sdk.sh "$RUNNER_TEMP/vulkan-sdk")
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Install interface packages
        run: npm --prefix ui ci

      # `sherpa-onnx-sys`'s build script would download its native library
      # itself, unchecked, and that library is linked into the installers.
      # Fetch it here instead, against the SHA-256 the script pins, and point
      # the build at the result. macOS builds both halves of the universal
      # binary, so it needs both archives.
      - name: Fetch and check the sherpa-onnx native library
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux)   archives=('sherpa-onnx-v{version}-linux-x64-static-lib.tar.bz2') ;;
            macos)   archives=('sherpa-onnx-v{version}-osx-arm64-static-lib.tar.bz2' 'sherpa-onnx-v{version}-osx-x64-static-lib.tar.bz2') ;;
            windows) archives=('sherpa-onnx-v{version}-win-x64-static-MT-Release-lib.tar.bz2') ;;
          esac
          dir="$RUNNER_TEMP/sherpa-onnx-archives"
          scripts/sherpa-archives.sh "$dir" "${archives[@]}"
          echo "SHERPA_ONNX_ARCHIVE_DIR=$dir" >> "$GITHUB_ENV"

      # The prebuilt CLI from npm; `cargo install tauri-cli` would compile it
      # from source on every runner for the same result. It is a devDependency
      # of ui/, pinned to an exact version in package.json, and `npm ci` above
      # installed it from package-lock.json, which records the integrity hash
      # of the CLI and of each platform binary behind it -- the build never
      # fetches a CLI by name from the registry. Keep it on the same minor as
      # the `tauri` crate in Cargo.lock, or the build refuses to start.
      # Run through `npm exec` rather than a global install, because the
      # global npm bin directory is not reliably on PATH inside Git Bash on
      # the Windows runner. `--prefix` finds ui/'s copy from the directory the
      # build runs in, and `--no` makes a missing one an error rather than an
      # install. This step fails loudly here, rather than 20 minutes into a
      # build, if the CLI did not install.
      - name: Check Tauri CLI
        run: npm --prefix ui exec --no -- tauri --version

      # The AppImage bundler would download AppRun, linuxdeploy and three
      # plugin scripts itself, with no checksum, several from URLs whose
      # content changes in place (`master`, `continuous`), and run them. It
      # skips whatever is already in its cache directory, so fill that with
      # files checked against the SHA-256s pinned in the script.
      - name: Fetch and check the AppImage tools
        if: matrix.name == 'linux'
        run: scripts/appimage-tools.sh "${XDG_CACHE_HOME:-$HOME/.cache}/tauri"

      - name: Build bundles
        working-directory: crates/jatayu-app
        env:
          BUNDLES: ${{ matrix.bundles }}
          RUST_TARGET: ${{ matrix.rust_target }}
          # linuxdeploy cannot strip a binary the dist profile already
          # stripped, and the runners have no FUSE for it to mount its own
          # AppImage with. Both are no-ops off Linux.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          args=(build --bundles "$BUNDLES")
          if [ -n "$RUST_TARGET" ]; then
            args+=(--target "$RUST_TARGET")
          fi
          # The `dist` profile, not `release`: `release` is tuned for build
          # time on a developer's machine, `dist` for what is shipped -- see
          # the root Cargo.toml. The CLI reads it to find the binary under
          # target/dist. Two words, not `--profile=dist`: only that spelling
          # stops the CLI adding a `--release` of its own, which cargo
          # refuses alongside a `--profile`.
          # `--locked` so the build fails, rather than quietly resolving
          # something else, if Cargo.lock does not match the manifests.
          args+=(-- --profile dist --locked)
          # Run from crates/jatayu-app, where tauri.conf.json is, so the
          # CLI comes from ui/'s install by `--prefix` rather than by path.
          npm --prefix ../../ui exec --no -- tauri "${args[@]}"

      # Nothing is signed or notarised: there are no Apple or Authenticode
      # certificates in this repository, and adding them means paid developer
      # accounts and secrets. macOS shows Gatekeeper's "unidentified developer"
      # warning and Windows shows SmartScreen's. That is expected.
      - name: Collect bundles
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # `! -name 'rw.*'` drops the read-write scratch image the dmg
          # bundler builds the real one from and leaves behind on failure.
          find "$BUNDLE_DIR" -type f ! -name 'rw.*' \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} dist/ \;

          if [ -z "$(ls -A dist)" ]; then
            echo "::error::$BUNDLE_DIR produced no installers" >&2
            exit 1
          fi
          ls -lh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jatayu-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [plan, build]
    # `needs` already requires every build to have succeeded, so a partial
    # set never reaches a Release.
    if: ${{ inputs.release != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # For the attestation step below and nothing else: the OIDC token it
      # signs with, and the right to store the result. They are on this job
      # and not the build jobs because this one runs none of the repository's
      # build scripts or dependencies -- it only handles finished files -- so
      # nothing a build compiles can mint an attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: jatayu-*
          merge-multiple: true

      # GitHub rewrites characters it will not put in an asset name: a
      # space in a bundle's name (there was one while the product was
      # "Karma Yoga") silently becomes a dot on upload. Do that rename here
      # instead, so the names recorded in
      # SHA256SUMS.txt are the names the assets actually end up with and
      # `sha256sum -c SHA256SUMS.txt` verifies a fresh download rather than
      # reporting six missing files.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            g=$(printf '%s' "$f" | sed 's/[^A-Za-z0-9._-]/./g')
            [ "$f" = "$g" ] || mv -- "$f" "$g"
          done
          # Written outside dist first, so the glob cannot include it.
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # A signed statement, kept by GitHub, that these exact files (the
      # checksum list included) were produced by this workflow run of this
      # repository at this commit. It is made before anything is uploaded, so
      # a failure here publishes nothing. Anyone can check a download with
      #
      #   gh attestation verify <file> --repo harigov/everyday
      #
      # which is stronger than SHA256SUMS.txt: that file sits beside the
      # installers, so whoever could replace one could replace the other.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repo from a remote.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          MODE: ${{ inputs.release }}
        run: |
          set -euo pipefail

          notes=$(cat <<'EOF'
          These installers are unsigned. macOS will report an unidentified
          developer and Windows SmartScreen will warn on first run.

          Verify a download against `SHA256SUMS.txt` before installing it.
          EOF
          )
          notes+=$'\n\n'"Each file also carries a GitHub build attestation, which shows it was built by this repository's release workflow: \`gh attestation verify <file> --repo $GH_REPO\`."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG exists; adding assets to it"
            # An asset already on a release is never replaced: people and the
            # attestations made for them refer to those exact bytes. `gh
            # release upload` refuses a name that is taken (that is what
            # leaving out `--clobber` means), but this says which, and why,
            # before it uploads any of them.
            existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            clash=0
            for f in dist/*; do
              name=${f#dist/}
              if grep -Fxq -- "$name" <<<"$existing"; then
                echo "::error::$TAG already has an asset named $name; it is not replaced. Delete it on the release page if you mean to, or release under another tag." >&2
                clash=1
              fi
            done
            [ "$clash" = 0 ] || exit 1
            gh release upload "$TAG" dist/*
          else
            flags=(--title "Jatayu $VERSION" --target "$GITHUB_SHA"
                   --notes "$notes" --generate-notes)
            if [ "$MODE" = draft ]; then
              flags+=(--draft)
            fi
            # 0.x is not a stable release, whatever the tag says.
            case "$VERSION" in
              0.*) flags+=(--prerelease) ;;
            esac
            gh release create "$TAG" "${flags[@]}" dist/*
          fi

          {
            echo "### $TAG"
            echo
            gh release view "$TAG" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"
