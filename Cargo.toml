[workspace]
resolver = "3"
members = [
    "crates/jatayu-core",
    "crates/jatayu-store-sql",
    "crates/jatayu-store-sqlite",
    "crates/jatayu-store-postgres",
    "crates/jatayu-vault",
    "crates/jatayu-transfer",
    "crates/jatayu-mcp",
    "crates/jatayu-service",
    "crates/jatayu-server",
    "crates/jatayu-cli",
    "crates/jatayu-mail",
    "crates/jatayu-mailindex",
    "crates/jatayu-docindex",
    "crates/jatayu-chat",
    "crates/jatayu-focus",
    "crates/jatayu-connect",
    "crates/jatayu-app",
]

# `jatayu-app` is a workspace member -- it shares the lockfile and can be
# built with `-p jatayu-app` -- but it is not a *default* member, because
# it links the platform webview (WebKitGTK on Linux) and would otherwise make
# a plain `cargo test` fail on any machine without those headers installed.
# Everything except the shell is portable Rust and always builds.
default-members = [
    "crates/jatayu-core",
    "crates/jatayu-store-sql",
    "crates/jatayu-store-sqlite",
    "crates/jatayu-store-postgres",
    "crates/jatayu-vault",
    "crates/jatayu-transfer",
    "crates/jatayu-mcp",
    "crates/jatayu-service",
    "crates/jatayu-server",
    "crates/jatayu-cli",
    "crates/jatayu-mail",
    "crates/jatayu-mailindex",
    "crates/jatayu-docindex",
    "crates/jatayu-chat",
    "crates/jatayu-focus",
    "crates/jatayu-connect",
]

# Patched copies of other people's crates (see `[patch.crates-io]` below).
# Not members, so not ours to lint or test; `cargo fmt --all` still checks
# them, against our rustfmt.toml.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Jatayu contributors"]

[workspace.dependencies]
jatayu-core = { path = "crates/jatayu-core" }
jatayu-store-sql = { path = "crates/jatayu-store-sql" }
jatayu-store-sqlite = { path = "crates/jatayu-store-sqlite" }
jatayu-store-postgres = { path = "crates/jatayu-store-postgres" }
jatayu-vault = { path = "crates/jatayu-vault" }
jatayu-transfer = { path = "crates/jatayu-transfer" }
jatayu-mcp = { path = "crates/jatayu-mcp" }
jatayu-service = { path = "crates/jatayu-service" }
jatayu-server = { path = "crates/jatayu-server" }
jatayu-mail = { path = "crates/jatayu-mail" }
jatayu-mailindex = { path = "crates/jatayu-mailindex" }
jatayu-docindex = { path = "crates/jatayu-docindex" }
jatayu-chat = { path = "crates/jatayu-chat" }
jatayu-focus = { path = "crates/jatayu-focus" }
jatayu-connect = { path = "crates/jatayu-connect" }

tauri = "2"
tauri-build = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
blake3 = "1"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize", "parallel"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
tracing = "0.1"

# matrix-sdk 0.19.1, the newest, pins ruma 0.17 and with it
# ruma-identifiers-validation 0.12, where a stranger's mxc:// URI or key ID
# could panic the Matrix sync (RUSTSEC-2026-0588, RUSTSEC-2026-0589). The fixes
# came in 0.13 and 0.14, which changed the signatures ruma 0.17 calls, so
# `vendor/` holds 0.12.1 with them backported (its CHANGELOG says how). Goes
# when matrix-sdk moves to ruma-identifiers-validation 0.14 or later.
[patch.crates-io]
ruma-identifiers-validation = { path = "vendor/ruma-identifiers-validation" }

# What `make build` (a bare `cargo tauri build`) makes: the app you run
# yourself, optimised, and built for the time it takes. No cross-crate LTO,
# and cargo's default sixteen codegen units, so each crate's code is
# generated in parallel and the last link does not re-optimise the whole
# program. Shipping it is `dist`'s job, below.
# The voice on this computer is a neural network run in pure Rust (`ptts` on
# `xn` and its matrix kernels), so an unoptimised build of it speaks about
# fifteen times slower than real time: a debug app, and the real-model voice
# test, would wait seconds per sentence. Only these crates are optimised in
# dev and test builds; everything else keeps its quick, debuggable build.
[profile.dev.package.ptts]
opt-level = 3
[profile.dev.package.xn]
opt-level = 3
[profile.dev.package.xn-gemm]
opt-level = 3
[profile.dev.package.xn-gemm-common]
opt-level = 3
[profile.dev.package.xn-gemm-f16]
opt-level = 3
[profile.dev.package.xn-gemm-f32]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
# The wake word's matrix products (`speech::spotter`), for the same reason: a
# debug app hears every 80 ms of the microphone through them.
[profile.dev.package.matrixmultiply]
opt-level = 3
# Kokoro's phonemes come from a small neural network written out by hand in
# `loqui-g2p`, for the words its lexicons lack; unoptimised, it would take
# longer over a name than the model takes over the sentence.
[profile.dev.package.loqui-g2p]
opt-level = 3

# The microphone's echo cancelling and noise suppression (sonora, a port of
# WebRTC's audio processing) and the resampler in front of it run on every
# 10 ms of audio: unoptimised, a phone build heard one second of speech in
# every twenty, and the assistant never heard anybody finish a sentence.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.sonora-aec3]
opt-level = 3
[profile.dev.package.sonora-agc2]
opt-level = 3
[profile.dev.package.sonora-common-audio]
opt-level = 3
[profile.dev.package.sonora-fft]
opt-level = 3
[profile.dev.package.sonora-ns]
opt-level = 3
[profile.dev.package.sonora-simd]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3

[profile.release]
opt-level = 3
# Unwind, not abort. The supervisor restarts a background task that panics,
# and mail sync contains a panic in the HTML libraries it hands a stranger's
# message to; with "abort" neither could run, and one bad email killed the
# app at the same message on every launch.
strip = true

# What a release ships: `make dist`, and `.github/workflows/release.yml`.
# Thin LTO over every crate and one codegen unit each -- what `release`
# itself used to be, for a binary a little smaller and faster, at several
# times the build. Under it, `jatayu-service` alone took four minutes on
# one core, and the app crate (whose cdylib is an LTO link of its own) and
# the final LTO link two to three more each, on every rebuild.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
