[workspace]
resolver = "3"
members = [
    "crates/karmayoga-core",
    "crates/karmayoga-store-sql",
    "crates/karmayoga-store-sqlite",
    "crates/karmayoga-store-postgres",
    "crates/karmayoga-vault",
    "crates/karmayoga-transfer",
    "crates/karmayoga-mcp",
    "crates/karmayoga-service",
    "crates/karmayoga-server",
    "crates/karmayoga-cli",
    "crates/karmayoga-mail",
    "crates/karmayoga-mailindex",
    "crates/karmayoga-chat",
    "crates/karmayoga-focus",
    "crates/karmayoga-app",
]

# `karmayoga-app` is a workspace member -- it shares the lockfile and can be
# built with `-p karmayoga-app` -- but it is not a *default* member, because
# it links the platform webview (WebKitGTK on Linux) and would otherwise make
# a plain `cargo test` fail on any machine without those headers installed.
# Everything except the shell is portable Rust and always builds.
default-members = [
    "crates/karmayoga-core",
    "crates/karmayoga-store-sql",
    "crates/karmayoga-store-sqlite",
    "crates/karmayoga-store-postgres",
    "crates/karmayoga-vault",
    "crates/karmayoga-transfer",
    "crates/karmayoga-mcp",
    "crates/karmayoga-service",
    "crates/karmayoga-server",
    "crates/karmayoga-cli",
    "crates/karmayoga-mail",
    "crates/karmayoga-mailindex",
    "crates/karmayoga-chat",
    "crates/karmayoga-focus",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Karma Yoga contributors"]

[workspace.dependencies]
karmayoga-core = { path = "crates/karmayoga-core" }
karmayoga-store-sql = { path = "crates/karmayoga-store-sql" }
karmayoga-store-sqlite = { path = "crates/karmayoga-store-sqlite" }
karmayoga-store-postgres = { path = "crates/karmayoga-store-postgres" }
karmayoga-vault = { path = "crates/karmayoga-vault" }
karmayoga-transfer = { path = "crates/karmayoga-transfer" }
karmayoga-mcp = { path = "crates/karmayoga-mcp" }
karmayoga-service = { path = "crates/karmayoga-service" }
karmayoga-server = { path = "crates/karmayoga-server" }
karmayoga-mail = { path = "crates/karmayoga-mail" }
karmayoga-mailindex = { path = "crates/karmayoga-mailindex" }
karmayoga-chat = { path = "crates/karmayoga-chat" }
karmayoga-focus = { path = "crates/karmayoga-focus" }

tauri = "2"
tauri-build = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
blake3 = "1"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
tracing = "0.1"

# What `make build` (a bare `cargo tauri build`) makes: the app you run
# yourself, optimised, and built for the time it takes. No cross-crate LTO,
# and cargo's default sixteen codegen units, so each crate's code is
# generated in parallel and the last link does not re-optimise the whole
# program. Shipping it is `dist`'s job, below.
[profile.release]
opt-level = 3
# Unwind, not abort. The supervisor restarts a background task that panics,
# and mail sync contains a panic in the HTML libraries it hands a stranger's
# message to; with "abort" neither could run, and one bad email killed the
# app at the same message on every launch.
strip = true

# What a release ships: `make dist`, and `.github/workflows/release.yml`.
# Thin LTO over every crate and one codegen unit each -- what `release`
# itself used to be, for a binary a little smaller and faster, at several
# times the build. Under it, `karmayoga-service` alone took four minutes on
# one core, and the app crate (whose cdylib is an LTO link of its own) and
# the final LTO link two to three more each, on every rebuild.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
