# Formatting settings for Every Day.
#
# One knob, and it is the one that matters here: `Max` lets rustfmt keep a
# short struct literal, match arm or array on the line it fits on, rather than
# exploding `Self { project: ProjectScope::Project { id }, ..Default::default() }`
# into six lines. The default heuristics are tuned for a 100-column line but
# wrap these constructs at 60, which in a codebase with this much doc comment
# in it spreads the code twice as thin as the prose describing it.
#
# This matches how the rest of the tree is already written. It does not make
# `cargo fmt --all -- --check` pass on a clean checkout: a handful of files
# were laid out by a different rustfmt release and no single configuration
# reproduces all of them, which is a pre-existing thing to sort out separately
# rather than by reflowing files a change has no business touching.
use_small_heuristics = "Max"
