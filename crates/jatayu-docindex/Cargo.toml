[package]
name = "jatayu-docindex"
description = "Document search: tantivy over the files folder's documents, behind mail's sealed Directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
jatayu-core.workspace = true
# For `SealedDirectory` and its decrypted-segment cache, which this index is
# written through exactly as mail's is: every segment sealed once, cached
# decrypted for the session. See that crate's `directory.rs`.
jatayu-mailindex.workspace = true
tracing.workspace = true
# The same engine and pin as `jatayu-mailindex`, so there is one copy of
# it in the build.
tantivy = "=0.27.0"

[dev-dependencies]
tempfile = "3"
