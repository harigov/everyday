[package]
name = "everyday-store-sqlite"
description = "SQLite driver for Every Day's SQL storage backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
everyday-core.workspace = true
everyday-store-sql.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
jiff.workspace = true

[dev-dependencies]
everyday-core = { workspace = true, features = ["testing"] }
everyday-store-sql = { workspace = true, features = ["testing"] }
tempfile = "3"
