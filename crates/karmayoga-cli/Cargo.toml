[package]
name = "karmayoga-cli"
description = "Command line interface to a Karma Yoga journal vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "karmayoga"
path = "src/main.rs"

[dependencies]
karmayoga-core.workspace = true
karmayoga-vault.workspace = true
karmayoga-service.workspace = true
karmayoga-transfer.workspace = true
karmayoga-server.workspace = true
karmayoga-chat.workspace = true
# For `expected_headers`: the pipe mirrors the same `_meta` fields into
# headers that `karmayoga-server` validates, and must derive them the exact
# same way rather than growing a second implementation of the rule to drift
# out of step with the first. A tiny, dependency-free crate to pull in for
# that alone.
karmayoga-mcp.workspace = true
serde_json.workspace = true
jiff.workspace = true
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
mime_guess = "2"
# Only `serve` needs a runtime, and it builds one itself: everything else this
# binary does is synchronous, and starting a runtime for every `karmayoga list`
# would be a cost paid by the common case for the sake of the rare one.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
qrcode = { version = "0.14", default-features = false }
# `mcp`'s blocking client, for the same reason `serve` gets a runtime of its
# own rather than `main` becoming async: this is otherwise a synchronous
# binary. The version is pinned to match `karmayoga-server`'s -- that crate is
# already a dependency of this one, so this is the one `reqwest` already in
# the tree rather than a second copy with its own feature set.
reqwest = { version = "0.13", features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
