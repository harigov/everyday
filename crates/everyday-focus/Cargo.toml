[package]
name = "everyday-focus"
description = "Which application has focus, how long since the last input, and whether the screen is locked -- on Windows, macOS, X11, wlroots compositors and KDE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Deliberately small: no async runtime, no webview, nothing of the vault's.
# The shell runs a `Watcher` on a thread of its own and turns what it sees
# into heartbeats; this crate only answers "what is in front of the person
# right now". Each platform's dependencies are its own.

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# logind's LockedHint, KDE's KWin scripting and screensaver, GNOME's idle
# monitor. The same version and default features the shell already builds:
# turning on zbus's `tokio` feature here would change it for the shell too.
zbus = "5"
# X11: `_NET_ACTIVE_WINDOW`, `WM_CLASS`, `_NET_WM_NAME`, and the
# screensaver extension's idle time. The pure-Rust connection.
x11rb = { version = "0.13", features = ["screensaver"] }
# wlroots compositors: `zwlr_foreign_toplevel_manager_v1` for the active
# toplevel and `ext_idle_notifier_v1` for idleness.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# `NSRunningApplication` for a pid's bundle id and name; `libc` is the
# feature that brings `runningApplicationWithProcessIdentifier:` (it takes a
# `pid_t`).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "libc"] }
# The window list, the idle clock and the session dictionary, through the
# objc2 family's own CoreGraphics and CoreFoundation bindings rather than
# `core-graphics`: they type `CFArray`/`CFDictionary` and retain/release for
# us, and `CGSessionCopyCurrentDictionary` is there without a hand-written
# `extern` block. Only the pieces used are switched on.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEventSource",
    "CGEventTypes",
    "CGSession",
    "CGWindow",
] }
