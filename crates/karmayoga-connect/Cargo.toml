[package]
name = "karmayoga-connect"
description = "An MCP client: Streamable HTTP and stdio, both protocol eras, and the MCP authorization flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jiff.workspace = true
tracing.workspace = true
rand.workspace = true
# Pinned to the tokio the service runs on; `process` for stdio servers.
tokio = { version = "1.53.1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
# The workspace's one HTTP stack. `stream` reads an SSE reply as it arrives.
reqwest = { version = "0.13", features = ["json", "stream", "gzip"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "process"] }
axum = "0.8"
