<!--
  Every Day — application mark. Master artwork; every PNG, .ico and .icns
  beside this file is generated from it by `make icons`.

  A sun clearing the horizon, and the horizon is the first line of an entry.
  The three bars taper the way a short paragraph does, so at large sizes the
  mark reads as writing and at small sizes it reads as a sunrise — which is
  the right pair of meanings for a journal called Every Day.

  Everything is a circle or a rounded bar on the centre line. That is what
  survives being scaled to 16 pixels and re-rasterised by three different
  operating systems.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm at the top-left, deepening to the interface accent (#b4530f)
         at the bottom-right, so the icon and the app agree on their colour. -->
    <linearGradient id="sky" x1=".12" y1="0" x2=".88" y2="1">
      <stop offset="0" stop-color="#ffc768"/>
      <stop offset=".42" stop-color="#f18a2b"/>
      <stop offset="1" stop-color="#ab440a"/>
    </linearGradient>
    <!-- A single soft highlight along the top edge. Enough to keep the tile
         from looking like flat vinyl, not enough to read as a gloss. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#sky)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>

  <!-- The sun is cropped by the first bar rather than sitting above it: it is
       rising, not floating. -->
  <circle cx="256" cy="190" r="86" fill="#fff9f2"/>

  <!-- Widths taper 352 / 258 / 164 and the opacity falls with them, so the
       eye reads a horizon receding rather than three equal rules. -->
  <rect x="80"  y="250" width="352" height="30" rx="15" fill="#fff9f2"/>
  <rect x="127" y="314" width="258" height="30" rx="15" fill="#fff9f2" opacity=".74"/>
  <rect x="174" y="378" width="164" height="30" rx="15" fill="#fff9f2" opacity=".5"/>
</svg>
