[package]
name = "everyday-app"
description = "Every Day desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Tauri builds mobile targets from a library, so the app lives in `lib.rs`
# and `main.rs` is a two-line shim. This is what makes an iOS/Android target
# a matter of `cargo tauri ios init` rather than a restructure.
name = "everyday_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
everyday-core.workspace = true
everyday-vault.workspace = true
# `tray-icon` is not a default feature: it pulls in muda and the platform
# status-item APIs, and an app without a tray should not carry them. See
# `src/tray.rs`. On Linux it also wants libayatana-appindicator at runtime,
# which is why the .deb declares it (tauri.conf.json) and `make setup`
# installs its headers.
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The portability layer for notifications. One API over UserNotifications on
# macOS, the XDG notification service on Linux, WinRT toasts on Windows, and
# the two mobile targets when their shells exist -- so `notify.rs` and the
# interface's notification service contain no per-platform code at all.
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The one network dependency in the whole application, and it is here in the
# shell rather than in the core on purpose: `everyday-core` has no async
# runtime, no TLS stack and no ability to open a socket, and the calendar
# feature is built so that stays true. This crate fetches bytes; the core
# does everything that happens to them afterwards.
#
# Default features are rustls, http2, charset and system-proxy, which is the
# right set: the platform's own trust store and the platform's own proxy
# settings, because a work calendar behind a corporate proxy is the common
# case rather than the exotic one. `gzip` on top -- a year of a busy calendar
# is a large text document, and every publisher serves it compressed if asked.
# Already in the dependency graph via Tauri, so this adds the TLS backend and
# not much else.
reqwest = { version = "0.13", features = ["gzip"] }
tauri-plugin-single-instance = "2"
rig-core = "0.42"
rig-agent = "0.42"
tokio = { version = "1.53.1", features = ["sync"] }
futures = "0.3.34"

[features]
# Enabled by `tauri dev`/`tauri build`; keeps devtools out of releases.
custom-protocol = ["tauri/custom-protocol"]
