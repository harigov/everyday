[package]
name = "everyday-app"
description = "Every Day desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Tauri builds mobile targets from a library, so the app lives in `lib.rs`
# and `main.rs` is a two-line shim. This is what makes an iOS/Android target
# a matter of `cargo tauri ios init` rather than a restructure.
name = "everyday_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
everyday-core.workspace = true
everyday-vault.workspace = true
everyday-service.workspace = true
everyday-server.workspace = true
# Chunks of an archive arrive from the service base64'd inside JSON; the
# shell decodes them straight into the file the user picked.
base64 = "0.22"
# `tray-icon` is not a default feature: it pulls in muda and the platform
# status-item APIs, and an app without a tray should not carry them. See
# `src/tray.rs`. On Linux it also wants libayatana-appindicator at runtime,
# which is why the .deb declares it (tauri.conf.json) and `make setup`
# installs its headers.
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The portability layer for notifications. One API over UserNotifications on
# macOS, the XDG notification service on Linux, WinRT toasts on Windows, and
# the two mobile targets when their shells exist -- so `notify.rs` and the
# interface's notification service contain no per-platform code at all.
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-single-instance = "2"
# The OS-wide hotkey that raises the palette. Registered lazily and switchable
# off, because a global shortcut is a claim on a key combination for the whole
# desktop and not every desktop will honour it -- Wayland wants a portal. See
# `hotkey.rs`.
tauri-plugin-global-shortcut = "2"
tokio = { version = "1.53.1", features = ["sync", "time"] }
jiff.workspace = true
# A device token is a bearer credential to an unlocked vault on another
# machine, so it goes in the operating system's own store rather than in a
# settings file. One API over the macOS keychain, the Windows credential
# manager and the XDG secret service. See `remotes.rs` for what happens where
# there is none.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Two microphone-and-loopback streams, resampled and framed into 30 s chunks
# and handed to the service. See `src/capture.rs` and
# `docs/plans/meeting-notes.md`'s "Decisions already made". `build_input_stream`
# on the *output* device is what gives loopback on every desktop: WASAPI
# transparently enables its loopback mode, CoreAudio opens a process tap
# (macOS 14.6+), and on Linux -- below -- the PipeWire host does the same
# through the sink's monitor.
cpal = "0.18"
# Resampling whatever rate the device hands us (usually 44.1 or 48 kHz,
# stereo) down to the 16 kHz mono every speech model in the plan wants. Pure
# Rust, so it costs nothing on platforms this crate cannot test.
rubato = "4"
# rubato 4's `Resampler::process_into_buffer` reads and writes through this
# crate's `Adapter`/`AdapterMut` traits rather than a bare slice; this is the
# buffer-adapter crate rubato's own author publishes for exactly that, so
# `capture.rs` isn't left implementing an unsafe trait by hand for one struct.
audioadapter-buffers = "4"
# WAV in and out for `capture::FileSink` -- the sink the capture spike
# (`examples/capture.rs`) and `capture`'s own tests write chunks through
# instead of the service. Not on the path anything shipped takes: the real
# sink sends PCM straight to `append_recording_chunk`, never a file.
hound = "3.5"

# PipeWire is what makes the loopback trick work on Linux: cpal exposes a sink
# node as a duplex device, and opening an *input* stream on it sets
# `STREAM_CAPTURE_SINK`, handing back that sink's monitor. ALSA is not behind
# a feature -- cpal always builds it as a target dependency on Linux -- so a
# desktop with no PipeWire session still gets a working microphone, just no
# system-audio track (`CaptureStatus::system_unavailable`). `pulseaudio` is
# deliberately not enabled: its host needs a newer rustc than this workspace's
# 1.85 MSRV. Building this feature wants PipeWire's development headers --
# see `make setup` and `.github/workflows/check.yml`.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire"] }

[dev-dependencies]
# `protocol.rs`'s mail route tests build their URLs from a real
# `sanitize::sanitize` call rather than a hand-assembled string, so the
# routing they check is the exact shape the sync engine seals into a body.
# Test-only: nothing in the shipped binary parses a message's HTML itself.
everyday-mail.workspace = true
# The capture spike (`examples/capture.rs`) only; nothing shipped bails out
# through `anyhow`.
anyhow = "1"

[features]
# Enabled by `tauri dev`/`tauri build`; keeps devtools out of releases.
custom-protocol = ["tauri/custom-protocol"]
