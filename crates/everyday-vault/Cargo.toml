[package]
name = "everyday-vault"
description = "Wires the Every Day core to its storage backends and platform paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The one place a key may be kept between runs, and only when somebody has
# said so: see `autounlock`. One API over the macOS keychain, the Windows
# credential manager and the XDG secret service.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
everyday-core.workspace = true
everyday-store-sqlite.workspace = true
everyday-store-postgres.workspace = true
directories = "6"

[dev-dependencies]
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
# Test-only: parsing the hostile `.eml` corpus and sanitising it the same
# way the real sync engine does, so `tests/mail_tools.rs` ingests messages
# that look like what a mailbox actually hands the vault rather than a
# hand-built approximation of one.
everyday-mail.workspace = true
