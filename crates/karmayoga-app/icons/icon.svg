<!--
  Karma Yoga — application mark. Master artwork; every PNG, .ico and .icns
  beside this file is generated from it by `make icons`.

  A wheel of the Sun's chariot at Konark. The temple is Surya's chariot on
  twenty-four of these wheels, and each one is also a sundial: the eight
  broad spokes split the day into eight prahars of three hours, and the
  eight slim spokes between them halve those. Karma is that wheel turning,
  a day at a time. What makes it Konark's wheel rather than any wheel is
  kept: broad and slim spokes alternating, a medallion halfway along each
  broad spoke with a dot at its centre, a rim in two bands and a grooved
  hub. The spokes swell where they meet the rim and the hub, so the joints
  are filleted rather than square.

  Gold on the night before dawn, lit from above. The wheel's solid is drawn
  once, in currentColor, and used four times: as a soft shadow under it, as
  the gold, as a lit band along every edge that faces up (the solid less
  itself moved down 5) and as a shaded band along every edge that faces
  down (less itself moved up 5). A faint halo sits outside the rim only, so
  the openings stay the colour of the sky.

  Built on Apple's icon grid so it sits level with the icons beside it: a
  1024 canvas, an 824 tile with 100 of margin all round, and the shadow
  falling into that margin. The tile is a continuous-corner squircle rather
  than a rounded rect — radius 22.5% with Figma's 60% corner smoothing,
  which is the curve macOS draws. GNOME's own icons keep a similar margin,
  so the same file is right for the Linux dock.

  At 32px the slim spokes and the medallions' holes fade and what is left is
  a gold rim, eight spokes and a hub. At 16px, in the tray, it is a gold
  ring round a gold hub on indigo, which is still the mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <path id="tile" d="M627.36 100c103.83 0 155.75 0 195.41 20.21a185.4 185.4 0 0 1 81.02 81.02c20.21 39.66 20.21 91.58 20.21 195.41L924 627.36c0 103.83 0 155.75 -20.21 195.41a185.4 185.4 0 0 1 -81.02 81.02c-39.66 20.21 -91.58 20.21 -195.41 20.21L396.64 924c-103.83 0 -155.75 0 -195.41 -20.21a185.4 185.4 0 0 1 -81.02 -81.02c-20.21 -39.66 -20.21 -91.58 -20.21 -195.41L100 396.64c0 -103.83 0 -155.75 20.21 -195.41a185.4 185.4 0 0 1 81.02 -81.02c39.66 -20.21 91.58 -20.21 195.41 -20.21Z"/>
    <clipPath id="clip"><use href="#tile"/></clipPath>

    <!-- The wheel is 312 in radius about the tile's centre; everything below
         is drawn about the wheel's centre, pointing up. -->

    <!-- One broad spoke, from inside the hub to under the rim, 29 wide,
         swelling to 42 at the hub and 49 at the rim; and its medallion,
         halfway along. -->
    <g id="broad">
      <path d="M-20.9 -56C-20.9 -84 -14.7 -88 -14.7 -104L-14.7 -226C-14.7 -248 -24.7 -252 -24.7 -270L24.7 -270C24.7 -252 14.7 -248 14.7 -226L14.7 -104C14.7 -88 20.9 -84 20.9 -56Z"/>
      <circle cy="-171.6" r="33.7"/>
    </g>
    <!-- One slim spoke, 10 wide, with a bead where the medallions are. -->
    <g id="slim">
      <path d="M-8.1 -56C-8.1 -84 -5 -88 -5 -104L-5 -226C-5 -248 -9.5 -252 -9.5 -270L9.5 -270C9.5 -252 5 -248 5 -226L5 -104C5 -88 8.1 -84 8.1 -56Z"/>
      <circle cy="-171.6" r="11.2"/>
    </g>
    <!-- What a medallion has cut out of it: a hole, and the dot left
         standing in it. -->
    <g id="medallion-cut">
      <circle cy="-171.6" r="16.8" fill="#000"/>
      <circle cy="-171.6" r="6.9" fill="#fff"/>
    </g>

    <mask id="cuts">
      <rect x="-400" y="-400" width="800" height="800" fill="#fff"/>
      <!-- The groove that splits the rim into two bands. -->
      <circle r="285.5" fill="none" stroke="#000" stroke-width="6.2"/>
      <!-- The groove round the hub's boss. -->
      <circle r="46" fill="none" stroke="#000" stroke-width="10.9"/>
      <use href="#medallion-cut"/>
      <use href="#medallion-cut" transform="rotate(45)"/>
      <use href="#medallion-cut" transform="rotate(90)"/>
      <use href="#medallion-cut" transform="rotate(135)"/>
      <use href="#medallion-cut" transform="rotate(180)"/>
      <use href="#medallion-cut" transform="rotate(225)"/>
      <use href="#medallion-cut" transform="rotate(270)"/>
      <use href="#medallion-cut" transform="rotate(315)"/>
    </mask>

    <!-- The wheel's solid, in currentColor. -->
    <g id="wheel" transform="translate(512 512)">
      <g mask="url(#cuts)" fill="currentColor">
        <circle r="287.8" fill="none" stroke="currentColor" stroke-width="48.4"/>
        <use href="#broad"/>
        <use href="#broad" transform="rotate(45)"/>
        <use href="#broad" transform="rotate(90)"/>
        <use href="#broad" transform="rotate(135)"/>
        <use href="#broad" transform="rotate(180)"/>
        <use href="#broad" transform="rotate(225)"/>
        <use href="#broad" transform="rotate(270)"/>
        <use href="#broad" transform="rotate(315)"/>
        <use href="#slim" transform="rotate(22.5)"/>
        <use href="#slim" transform="rotate(67.5)"/>
        <use href="#slim" transform="rotate(112.5)"/>
        <use href="#slim" transform="rotate(157.5)"/>
        <use href="#slim" transform="rotate(202.5)"/>
        <use href="#slim" transform="rotate(247.5)"/>
        <use href="#slim" transform="rotate(292.5)"/>
        <use href="#slim" transform="rotate(337.5)"/>
        <circle r="73.3"/>
      </g>
    </g>

    <mask id="solid"><use href="#wheel" color="#fff"/></mask>
    <mask id="lit">
      <use href="#wheel" color="#fff"/>
      <use href="#wheel" color="#000" transform="translate(0 5)"/>
    </mask>
    <mask id="shade">
      <use href="#wheel" color="#fff"/>
      <use href="#wheel" color="#000" transform="translate(0 -5)"/>
    </mask>

    <!-- macOS's two-part shadow under the tile: a tight contact shadow and
         a soft one further down. Both land inside the 100 of margin. -->
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="near"/>
      <feOffset in="near" dy="4" result="near"/>
      <feFlood flood-color="#000" flood-opacity=".22"/>
      <feComposite in2="near" operator="in" result="near"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="far"/>
      <feOffset in="far" dy="14" result="far"/>
      <feFlood flood-color="#000" flood-opacity=".26"/>
      <feComposite in2="far" operator="in" result="far"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Night, a little lighter behind the wheel. -->
    <radialGradient id="sky" cx=".5" cy=".46" r=".62">
      <stop offset="0" stop-color="#262a72"/>
      <stop offset="1" stop-color="#0a0c26"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="200" x2="0" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe596"/>
      <stop offset=".5" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#ea8a2a"/>
    </linearGradient>
    <!-- Clear inside the rim, rising at its edge and gone by 1.26 radii. -->
    <radialGradient id="halo" cx="512" cy="512" r="393" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc24d" stop-opacity="0"/>
      <stop offset=".782" stop-color="#ffc24d" stop-opacity="0"/>
      <stop offset=".794" stop-color="#ffc24d" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffc24d" stop-opacity="0"/>
    </radialGradient>
    <!-- The tile's own edge: lit along the top, faintly dark along the
         bottom, so it keeps an outline against a dark dock. -->
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".2" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <g filter="url(#drop)">
    <g clip-path="url(#clip)">
      <use href="#tile" fill="url(#sky)"/>
      <circle cx="512" cy="512" r="393" fill="url(#halo)"/>

      <use href="#wheel" color="#000" opacity=".32" transform="translate(0 10)" filter="url(#soft)"/>
      <rect width="1024" height="1024" fill="url(#gold)" mask="url(#solid)"/>
      <rect width="1024" height="1024" fill="#fff6d2" opacity=".85" mask="url(#lit)"/>
      <rect width="1024" height="1024" fill="#a8521a" opacity=".55" mask="url(#shade)"/>

      <use href="#tile" fill="none" stroke="url(#rim)" stroke-width="6"/>
    </g>
  </g>
</svg>
