<!--
  Karma Yoga — application mark. Master artwork; every PNG, .ico and .icns
  beside this file is generated from it by `make icons`.

  A wheel of the Sun's chariot at Konark. The temple is Surya's chariot on
  twenty-four of these wheels, and each one is also a sundial: the eight
  spokes split the day into eight prahars of three hours. Karma is that
  wheel turning, a day at a time.

  Three layers, each with its own colour and weight, so the wheel reads as
  made rather than drawn in one pen:
  - the rim, a band of frosted glass ruled like a watch bezel: twenty-four
    hour marks for the sundial's day, and fainter marks between them, with
    a lit line along each edge;
  - the spokes, slim and a pale ice white rather than pure white, meeting
    at a hub of the same; they stop flush at the glass;
  - the sun at the hub, with eight short amber rays floating between the
    spokes where Konark's slim spokes are.

  Everything solid casts a soft shadow on the sky, as if the wheel sat a
  little above it. The glass casts one too, but only outside its own band:
  a shadow seen through the frosting turned it grey.

  Built on Apple's icon grid so it sits level with the icons beside it: a
  1024 canvas, an 824 tile with 100 of margin all round, and the shadow
  falling into that margin. The tile is a continuous-corner squircle rather
  than a rounded rect — radius 22.5% with Figma's 60% corner smoothing,
  which is the curve macOS draws. GNOME's own icons keep a similar margin,
  so the same file is right for the Linux dock.

  At 32px the bezel's marks merge into a pale ring and what is left is that
  ring, a white cross and the sun. At 16px, in the tray, it is a pale ring
  round an orange dot on blue, which is still the mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <path id="tile" d="M627.36 100c103.83 0 155.75 0 195.41 20.21a185.4 185.4 0 0 1 81.02 81.02c20.21 39.66 20.21 91.58 20.21 195.41L924 627.36c0 103.83 0 155.75 -20.21 195.41a185.4 185.4 0 0 1 -81.02 81.02c-39.66 20.21 -91.58 20.21 -195.41 20.21L396.64 924c-103.83 0 -155.75 0 -195.41 -20.21a185.4 185.4 0 0 1 -81.02 -81.02c-20.21 -39.66 -20.21 -91.58 -20.21 -195.41L100 396.64c0 -103.83 0 -155.75 20.21 -195.41a185.4 185.4 0 0 1 81.02 -81.02c39.66 -20.21 91.58 -20.21 195.41 -20.21Z"/>
    <clipPath id="clip"><use href="#tile"/></clipPath>

    <!-- The wheel is 300 in radius about the tile's centre; everything below
         is drawn about the wheel's centre. The rim is a band 68 wide, from
         232 out to 300, drawn as a stroke along its middle at 266. -->

    <!-- Two spokes in one line, through the centre, stopping at the glass. -->
    <line id="spoke" y1="-232" y2="232" stroke-width="26"/>
    <!-- One ray, pointing up, floating between the hub and the rim. -->
    <line id="ray" y1="-130" y2="-196" stroke-width="12" stroke-linecap="round"/>

    <!-- The spokes and the hub, and the rays, each in currentColor: drawn
         once and used both as a shadow and as a mask for their colour, so
         the colour's gradient runs top to bottom across the whole wheel
         instead of turning with each rotated part. -->
    <g id="spokes" transform="translate(512 512)" stroke="currentColor" fill="currentColor">
      <use href="#spoke"/>
      <use href="#spoke" transform="rotate(45)"/>
      <use href="#spoke" transform="rotate(90)"/>
      <use href="#spoke" transform="rotate(135)"/>
      <circle r="84" stroke="none"/>
    </g>
    <g id="rays" transform="translate(512 512)" stroke="currentColor">
      <use href="#ray" transform="rotate(22.5)"/>
      <use href="#ray" transform="rotate(67.5)"/>
      <use href="#ray" transform="rotate(112.5)"/>
      <use href="#ray" transform="rotate(157.5)"/>
      <use href="#ray" transform="rotate(202.5)"/>
      <use href="#ray" transform="rotate(247.5)"/>
      <use href="#ray" transform="rotate(292.5)"/>
      <use href="#ray" transform="rotate(337.5)"/>
    </g>
    <mask id="spokes-m"><use href="#spokes" color="#fff"/></mask>
    <mask id="rays-m"><use href="#rays" color="#fff"/></mask>
    <!-- Everywhere but the glass, for the glass's shadow. -->
    <mask id="outside">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="512" r="300" fill="#000"/>
    </mask>

    <!-- macOS's two-part shadow under the tile: a tight contact shadow and
         a soft one further down. Both land inside the 100 of margin. -->
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="near"/>
      <feOffset in="near" dy="4" result="near"/>
      <feFlood flood-color="#000" flood-opacity=".22"/>
      <feComposite in2="near" operator="in" result="near"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="far"/>
      <feOffset in="far" dy="14" result="far"/>
      <feFlood flood-color="#000" flood-opacity=".26"/>
      <feComposite in2="far" operator="in" result="far"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- Morning sky: cyan at the top, deepening to blue. -->
    <linearGradient id="sky" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fd2ff"/>
      <stop offset=".55" stop-color="#1a7cf5"/>
      <stop offset="1" stop-color="#0b4fd6"/>
    </linearGradient>
    <!-- Light falling on the top of the tile. -->
    <radialGradient id="sheen" cx="512" cy="140" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="232" x2="0" y2="792" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#d6e5fa"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="300" x2="0" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ff9a2a"/>
    </linearGradient>
    <!-- The glass, in the wheel's own coordinates: clearer towards the
         bottom, away from the light. -->
    <linearGradient id="glass" x1="0" y1="-300" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="-54" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <!-- The tile's own edge: lit along the top, faintly dark along the
         bottom, so it keeps an outline against a dock of either colour. -->
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".25" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
  </defs>

  <g filter="url(#drop)">
    <g clip-path="url(#clip)">
      <use href="#tile" fill="url(#sky)"/>
      <rect width="1024" height="1024" fill="url(#sheen)"/>

      <!-- Shadows: the glass's (outside it only), the spokes' and hub's. -->
      <g mask="url(#outside)">
        <circle cx="512" cy="522" r="300" fill="#04256f" opacity=".32" filter="url(#soft)"/>
      </g>
      <use href="#spokes" color="#04256f" opacity=".32" transform="translate(0 10)" filter="url(#soft)"/>

      <rect width="1024" height="1024" fill="url(#ice)" mask="url(#spokes-m)"/>

      <g transform="translate(512 512)" fill="none">
        <circle r="266" stroke="url(#glass)" stroke-width="68"/>
        <circle r="298.75" stroke="#fff" stroke-opacity=".85" stroke-width="2.5"/>
        <circle r="233.25" stroke="#fff" stroke-opacity=".5" stroke-width="2.5"/>
        <!-- The bezel's marks, as dashes along the band's middle. A circle's
             stroke starts at three o'clock, which is an hour mark, and the
             offset of half a dash centres each mark on its hour. The
             circumference is 2π·266 = 1671.327. -->
        <circle r="266" stroke="#fff" stroke-opacity=".6" stroke-width="20"
                stroke-dasharray="3.5 19.7129" stroke-dashoffset="1.75"/>
        <circle r="266" stroke="#fff" stroke-opacity=".95" stroke-width="36"
                stroke-dasharray="7 62.6386" stroke-dashoffset="3.5"/>
      </g>

      <use href="#rays" color="#7a3d00" opacity=".25" transform="translate(0 4)" filter="url(#soft)"/>
      <rect width="1024" height="1024" fill="url(#amber)" mask="url(#rays-m)"/>

      <circle cx="512" cy="517" r="54" fill="#7a3d00" opacity=".3" filter="url(#soft)"/>
      <g transform="translate(512 512)"><circle r="54" fill="url(#sun)"/></g>

      <use href="#tile" fill="none" stroke="url(#rim)" stroke-width="6"/>
    </g>
  </g>
</svg>
